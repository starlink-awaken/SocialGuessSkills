# Nginx configuration for SocialGuess production deployment

# Upstream for MCP server (stdio communication, not HTTP)
upstream socialguess_mcp {
    server socialguess-server:3000;
    keepalive 32;
}

# Upstream for Web UI
upstream socialguess_web {
    server socialguess-web-prod:5173;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'self'; form-action 'self';" always;

    # Access and error logs
    access_log /var/log/nginx/socialguess_access.log;
    error_log /var/log/nginx/socialguess_error.log;

    # Root location (redirects to Web UI)
    location / {
        proxy_pass http://socialguess_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket support for Vite HMR in development
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API routes (MCP - note: MCP uses stdio, not HTTP, but we expose health check)
    location /api/health {
        proxy_pass http://socialguess_mcp/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API authentication middleware endpoint
    location /api/auth {
        proxy_pass http://socialguess_mcp/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://socialguess_web;
        proxy_cache_valid 200 1y;
        proxy_cache_valid 404 1m;
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=socialguess:10m rate=10r/s;
    limit_req_status 429;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
}
